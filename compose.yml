# Join Bazarr's existing network. No host ports, secrets or media mounts.
services:
  whisper-arc:
    build: .
    image: whisper-arc-bazarr:local
    container_name: whisper-arc
    user: "65534:65534"
    group_add:
      - "${RENDER_GID:?Set RENDER_GID to the host render device numeric group}"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./models/whisper:/models:ro
      - ./models/translation:/translation-model:ro
    environment:
      # Optional translation engine: any OpenAI-compatible endpoint (the fleet
      # LiteLLM proxy is what this project is tested against). Required for
      # arbitrary source/target pairs; offline translation is English -> Spanish only.
      - TRANSLATION_ENDPOINT=${TRANSLATION_ENDPOINT:-}
      - TRANSLATION_MODEL=${TRANSLATION_MODEL:-subtitle-translate}
      - TRANSLATION_API_KEY=${TRANSLATION_API_KEY:-}
      # Fall back only for English -> Spanish if the proxy fails or returns junk.
      - TRANSLATION_LOCAL_FALLBACK=${TRANSLATION_LOCAL_FALLBACK:-true}
      # Unix/POSIX locale notation. Source is the detection fallback. Target is
      # the default region for matching bare target codes; explicit API locales
      # override it. Other target languages use their own labels (fr, ja, pt_BR).
      - TRANSLATION_SOURCE_LOCALE=${TRANSLATION_SOURCE_LOCALE:-en_US.UTF-8}
      - TRANSLATION_TARGET_LOCALE=${TRANSLATION_TARGET_LOCALE:-es_MX.UTF-8}
      # Request logs name the media file Bazarr sends as video_file. Extra
      # requests queue for the single pipeline instead of failing immediately.
      - WHISPER_LOG_LEVEL=${WHISPER_LOG_LEVEL:-INFO}
      - WHISPER_GATE_WAIT_SECONDS=${WHISPER_GATE_WAIT_SECONDS:-900}
      - WHISPER_MAX_WAITERS=${WHISPER_MAX_WAITERS:-4}
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      start_period: 30s
    networks:
      - bazarr
networks:
  bazarr:
    external: true
    name: "${BAZARR_NETWORK:-servarrnetwork}"
